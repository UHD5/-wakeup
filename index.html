<style>
:root {
  --bg: #f4f5fb;
  --surface: #ffffff;
  --surface-2: #f1f2f8;
  --text: #1b1d26;
  --text-2: #6b7080;
  --line: #e6e8f0;
  --accent: #5668ff;
  --accent-soft: #e9ecff;
  --shadow: 0 8px 24px rgba(30,34,60,.08);
  --radius: 16px;
  --maxw: 840px;
}
html[data-theme="dark"] {
  --bg: #101119;
  --surface: #1a1c26;
  --surface-2: #23252f;
  --text: #eceef4;
  --text-2: #9aa0b2;
  --line: #2b2e3a;
  --accent: #7d8bff;
  --accent-soft: #262a3f;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
  max-width: var(--maxw); margin: 0 auto;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, #5668ff, #8c60ff);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
  box-shadow: 0 4px 12px rgba(86,104,255,.35);
}
.brand h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
.brand .term { font-size: 12px; color: var(--text-2); margin-top: 1px; }
.icon-btn {
  border: 0; background: var(--surface); width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center; font-size: 18px; color: var(--text); cursor: pointer;
  box-shadow: var(--shadow); transition: transform .12s;
}
.icon-btn:active { transform: scale(.92); }
.week-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #5668ff, #7a5cff);
  color: #fff; border-radius: var(--radius); padding: 16px 18px; margin-top: 6px;
  box-shadow: var(--shadow); cursor: pointer;
}
.week-banner .wk-label { font-size: 12px; opacity: .9; letter-spacing: .5px; }
.week-banner .wk-num { font-size: 30px; font-weight: 800; line-height: 1.05; }
.week-banner .wk-date { font-size: 12px; opacity: .85; margin-top: 3px; }
.week-banner .today-chip {
  font-size: 12px; background: rgba(255,255,255,.22); padding: 5px 10px; border-radius: 999px; font-weight: 600;
}
.wk-note { font-size: 12px; color: var(--text-2); margin: 8px 4px 4px; }
.seg {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2);
  border-radius: 14px; padding: 5px; margin-top: 12px;
}
.seg button {
  border: 0; background: transparent; color: var(--text-2); font-size: 15px; font-weight: 600;
  padding: 9px; border-radius: 10px; cursor: pointer; transition: all .15s;
}
.seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.now-card {
  margin-top: 12px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
  padding: 16px 18px; border-left: 5px solid var(--accent);
}
.now-card .now-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.now-card .now-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100% { opacity:.5; transform: scale(.85);} 50% { opacity:1; transform: scale(1.15);} }
.now-card .now-name { font-size: 20px; font-weight: 800; line-height: 1.25; }
.now-card .now-sub { font-size: 13px; color: var(--text-2); margin-top: 6px; }
.now-card .now-meta { font-size: 13px; color: var(--text-2); margin-top: 4px; }
.now-card .now-bar { height: 6px; border-radius: 999px; background: var(--surface-2); margin-top: 12px; overflow: hidden; }
.now-card .now-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.block-title { display: flex; align-items: center; gap: 10px; margin: 20px 4px 10px; font-weight: 700; font-size: 15px; }
.block-title .line { flex: 1; height: 1px; background: var(--line); }
.day-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {

.day-tab .n { font-size: 11px; color: var(--text-2); margin-top: 2px; }

.day-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.day-tab.on .n { color: rgba(255,255,255,.85); }
.course-list { display: flex; flex-direction: column; gap: 10px; }
.course {

  padding: 13px 14px 13px 16px; overflow: hidden; cursor: pointer; transition: transform .12s;

}
.course:active { transform: scale(.985); }
.course .tt { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.course .name { font-size: 16px; font-weight: 800; }

.grid-scroll { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); background: var(--surface); }
.grid { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 640px; padding: 6px; }
.grid th, .grid td { padding: 0; }

.grid td.slot.is-now { background: var(--accent-soft); outline: 2px solid var(--accent); }

.grid .gc .loc { opacity: .9; font-weight: 500; }
.grid .gc.ghost { opacity: .7; }
.sheet-mask { position: fixed; inset: 0; background: rgba(12,14,22,.5); backdrop-filter: blur(2px); display: none; align-items: flex-end; justify-content: center; z-index: 40; }
.sheet-mask.show { display: flex; }
.sheet { width: 100%; max-width: var(--maxw); background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); animation: up .22s ease; max-height: 88vh; overflow-y: auto; }
@keyframes up { from { transform: translateY(30px); opacity: 0;} to { transform: none; opacity: 1;} }
.sheet .grab { width: 42px; height: 5px; border-radius: 999px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 4px; font-size: 22px; }
.sheet .sub { font-size: 13px; color: var(--text-2); }
.sheet .row { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sheet .row .k { color: var(--text-2); }
.sheet .teachers { margin: 0; padding-left: 16px; }
.sheet .teachers li { margin: 4px 0; }
.sheet .close { margin-top: 18px; width: 100%; border: 0; background: var(--accent); color: #fff; padding: 13px; border-radius: 14px; font-size: 15px; font-weight: 700; }
button.close { cursor: pointer; }
.field { margin: 14px 0; }
.field label { font-size: 13px; color: var(--text-2); display: block; margin-bottom: 6px; }
.field input, .field select { width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: 15px; }
.hint { font-size: 12px; color: var(--text-2); line-height: 1.5; }
footer { text-align: center; font-size: 11px; color: var(--text-2); margin-top: 28px; line-height: 1.6; }

</style>

<script>
"use strict";

const PERIODS = [
{start:"08:00",end:"08:45"},{start:"08:50",end:"09:35"},
{start:"09:50",end:"10:35"},{start:"10:40",end:"11:25"},
{start:"13:30",end:"14:15"},{start:"14:20",end:"15:05"},

{start:"18:30",end:"19:15"},{start:"19:20",end:"20:05"},
{start:"20:10",end:"20:55"},{start:"21:00",end:"21:45"}];

const GRID_ROWS = [
{group:"第1,2节",section:"上午"},{group:"第3,4节",section:"上午"},
{group:"第5,6节",section:"下午"},{group:"第7,8节",section:"下午"},
{group:"第9,10节",section:"晚上"},{group:"第11,12节",section:"晚上"}];

const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const PALETTE = ["#5668ff","#2eb8a6","#e55d7b","#f3a23a","#8b64e0","#2ba6d6","#e87f52","#58bd53"];
const DEFAULT_SETTINGS = {term:"2026 秋季学期",student:"赵闻博",semesterStart:"2026-08-31",totalWeeks:17,theme:"auto",simDate:"",simTime:""};
const $ = (s) => document.querySelector(s);
const storeKey = "kebiao-settings-v1";
let save = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem(storeKey)||"{}"));
let courses = (DATA && DATA.courses) || [];
const state = {view:"today", day:null, selWeek:null, selectedCourse:null};

function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function realDay(){ return new Date().getDay()===0?7:new Date().getDay(); }
function hmToMin(s){ const p=s.split(":").map(Number); return p[0]*60+p[1]; }
function parseDate(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtWeekday(d){ return d.getDay()===0?7:d.getDay(); }

function weekOf(dateStr, startStr){
  const d=startOfDay(parseDate(dateStr)).getTime();
  const s=startOfDay(parseDate(startStr)).getTime();
  const diff=Math.round((d-s)/86400000);
  return Math.floor(diff/7)+1;
}
function rawWeek(){ return weekOf(effTodayStr(), save.semesterStart); }
function effWeek(){
  if(state.selWeek!=null) return state.selWeek;
  return Math.min(Math.max(rawWeek(),1), save.totalWeeks);
}
function effTodayStr(){ return save.simDate || todayStr(); }
function effDay(){ const d=parseDate(effTodayStr()); return fmtWeekday(d); }
function effNow(){ const t=save.simTime || (new Date().getHours()+":"+pad(new Date().getMinutes())); return hmToMin(t); }
function effectiveDay(){ return state.day!=null ? state.day : effDay(); }
function theme(){ if(save.theme==="light")return"light"; if(save.theme==="dark")return"dark"; return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"; }

function colorFor(name){ let h=0; for(const ch of name){ h=(h*31+ch.charCodeAt(0))>>>0; } return PALETTE[h%PALETTE.length]; }
function rangeText(weeks){
  if(!weeks||!weeks.length) return ""; const parts=[]; let s=weeks[0],p=weeks[0];
  for(let i=1;i<weeks.length;i++){ if(weeks[i]===p+1){ p=weeks[i]; continue; } parts.push(s===p?"第"+s+"周":"第"+s+"-"+p+"周"); s=weeks[i]; p=weeks[i]; }
  parts.push(s===p?"第"+s+"周":"第"+s+"-"+p+"周"); return parts.join("、");
}
function teacherText(course, week){
  const tw=course.teachers||[];
  if(!tw.length) return "";
  if(tw.length===1) return tw[0].teacher;
  const spec=tw.find(t=>week!=null&&t.weeks.indexOf(week)>=0);
  return spec?spec.teacher:tw.map(t=>t.teacher).join("/");
}
function teacherDetail(course){
  const tw=course.teachers||[];
  if(!tw.length) return "";
  if(tw.length===1) return tw[0].teacher;
  const li=tw.map(t=>t.teacher+"（"+rangeText(t.weeks)+"周）");
  return "<ul class='teachers'>"+li.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
}
function coursesForWeek(week){ return courses.filter(function(c){ return c.weeks.indexOf(week)>=0; }); }
function coursesForDay(week, day){ return coursesForWeek(week).filter(function(c){ return c.day===day; }).sort(function(a,b){ return a.start-b.start; }); }
function timeRange(c){ return PERIODS[c.start-1].start+"–"+PERIODS[c.end-1].end; }
function periodOfNow(now){ for(let i=0;i<PERIODS.length;i++){ const p=PERIODS[i]; if(now>=hmToMin(p.start)&&now<hmToMin(p.end)) return i+1; } return 0; }

/* ============ persistence ============ */
function persist(){ localStorage.setItem(storeKey, JSON.stringify(save)); }

/* ============ top banner ============ */
function renderBanner(){
  const w=rawWeek();
  $("#termText").textContent = save.term + (save.student?(" · "+save.student):"");
  let label, note;
  const outTerm = (w<1 || w>save.totalWeeks) && state.selWeek==null;
  if(outTerm && w<1){ label="开学前"; note="本学期还未开始，"+save.semesterStart+" 起为第 1 周。"; }
  else if(outTerm && w>save.totalWeeks){ label="已结课"; note="本学期课程已经结束，可在周次选择器里回看。"; }
  else { label="第 "+effWeek()+" 周"; note=""; }
  $("#wkNum").textContent = label;
  const d=parseDate(effTodayStr());
  $("#wkDate").textContent = (d.getMonth()+1)+"月"+d.getDate()+"日 · "+DAYS[effDay()-1];
  $("#todayChip").textContent = state.selWeek!=null?("浏览 · 第"+state.selWeek+"周"):(outTerm?"假期":"自动定位本周");
  const noteEl=$("#wkNote");
  if(note){ noteEl.style.display="block"; noteEl.textContent=note; } else { noteEl.style.display="none"; }
}

/* ============ week strip navigator ============ */
function renderWeekStrip(){
  const mask=$("#weekStripMask");
  const w=rawWeek();
  let chips="";
  for(let i=1;i<=save.totalWeeks;i++){
    const active=(state.selWeek==null)?(i===w):(i===state.selWeek);
    const today=(i===w);
    chips+="<div class='day-tab "+(active?"on":"")+"' data-w='"+i+"' style='min-width:56px'><div class='d'>第"+i+"周</div><div class='n'>"+(today?"本周":"")+"</div></div>";
  }
  const backBtn=state.selWeek!=null?"<button class='close' style='margin-top:10px;background:var(--surface-2);color:var(--text)' id='stripBack'>回到本周</button>":"";
  mask.innerHTML="<div class='sheet' style='padding-top:12px'><div class='grab'></div><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'><div style='font-weight:800'>选择周次</div><div style='font-size:12px;color:var(--text-2)'>点击周次查看</div></div><div class='day-tabs' style='flex-wrap:wrap;padding-top:2px'>"+chips+"</div>"+backBtn+"<button class='close' id='stripClose'>完成</button></div>";
  mask.classList.add("show");
  mask.querySelectorAll("[data-w]").forEach(function(el){
    el.onclick=function(){ state.selWeek=Number(el.getAttribute("data-w")); closeStrip(); renderAll(); };
  });
  mask.querySelector("#stripClose").onclick=closeStrip;
  if(state.selWeek!=null) mask.querySelector("#stripBack").onclick=function(){ state.selWeek=null; closeStrip(); renderAll(); };
}
function closeStrip(){ $("#weekStripMask").classList.remove("show"); }

/* ============ now card ============ */
function renderNow(){
  const el=$("#nowCard");
  const w=effWeek();
  const day=effDay();
  const todayCourses=coursesForDay(w, day);
  const now=effNow();
  let html="";
  if(rawWeek()<1||rawWeek()>save.totalWeeks){
    el.style.display="none"; return;
  }
  if(!todayCourses.length){
    html="<div class='now-tag'><span class='dot'></span>今天</div><div class='now-name'>没有课</div><div class='now-sub'>"+DAYS[day-1]+" 可以在全周视图查看本周安排。</div>";
  } else {
    let ongoing=null, next=null;
    todayCourses.forEach(function(c){
      const s=hmToMin(PERIODS[c.start-1].start), e=hmToMin(PERIODS[c.end-1].end);
      if(now>=s&&now<e) ongoing=c;
      else if(now<s&&(!next||s<hmToMin(PERIODS[next.start-1].start))) next=c;
    });
    if(ongoing){
      const s=hmToMin(PERIODS[ongoing.start-1].start), e=hmToMin(PERIODS[ongoing.end-1].end);
      const left=e-now, pct=Math.round((now-s)/(e-s)*100);
      html="<div class='now-tag'><span class='dot'></span>正在上课</div><div class='now-name'>"+ongoing.name+"</div><div class='now-sub'>"+timeRange(ongoing)+" · "+teacherText(ongoing,w)+"</div>"+(ongoing.location?"<div class='now-meta'>📍 "+ongoing.location+"</div>":"")+"<div class='now-bar'><i style='width:"+pct+"%'></i></div><div class='now-meta' style='margin-top:6px'>还有 "+left+" 分钟下课</div>";
    } else if(next){
      const s=hmToMin(PERIODS[next.start-1].start);
      const dist=s-now;
      html="<div class='now-tag'><span class='dot'></span>下一节</div><div class='now-name'>"+next.name+"</div><div class='now-sub'>"+timeRange(next)+" · "+teacherText(next,w)+"</div>"+(next.location?"<div class='now-meta'>📍 "+next.location+"</div>":"")+"<div class='now-meta' style='margin-top:6px'>"+Math.floor(dist/60)+" 小时 "+(dist%60)+" 分后开始</div>";
    } else {
      html="<div class='now-tag'><span class='dot'></span>今天</div><div class='now-name'>课程已结束</div><div class='now-sub'>今天共 "+todayCourses.length+" 节，可以准备休息啦。</div>";
    }
  }
  el.style.display="block";
  el.innerHTML=html;
}

/* ============ day tabs + list ============ */
function renderDayTabs(){
  const el=$("#dayTabs"); const w=effWeek();
  let html="";
  for(let i=1;i<=7;i++){
    const today=i===realDay();
    const nowDay=i===effectiveDay();
    const count=coursesForDay(w,i).length;
    html+="<div class='day-tab "+(nowDay?"on":"")+" "+(today?"today":"")+"' data-d='"+i+"'><div class='d'>"+DAYS[i-1]+"</div><div class='n'>"+(today?"今天":(count?count+" 节":"无课"))+"</div></div>";
  }
  el.innerHTML=html;
  el.querySelectorAll("[data-d]").forEach(function(t){
    t.onclick=function(){ state.day=Number(t.getAttribute("data-d")); renderAll(); };
  });
  // scrolling selected into view
  const active=el.querySelector(".on"); if(active) active.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
function renderDayList(){
  const el=$("#dayList"); const w=effWeek(); const day=effectiveDay();
  const list=coursesForDay(w,day);
  const isTerm=rawWeek()>=1&&rawWeek()<=save.totalWeeks;
  if(list.length===0){
    el.innerHTML="<div class='empty'><div class='big' "+(isTerm?"":"")+">📭</div>"+(isTerm?"这一天没有课程安排。":"当前不在教学周内，暂不显示课程。")+"</div>";
    return;
  }
  el.innerHTML=list.map(function(c){
    const col=colorFor(c.name);
    return "<div class='course' data-c='"+c.id+"' style='--c:"+col+"'><div class='tt'><div class='name'>"+c.name+"</div><div class='time'>"+timeRange(c)+"</div></div><div class='info'><span><b>"+teacherText(c,w)+"</b></span>"+(c.location?"<span>📍 "+c.location+"</span>":"")+"<span class='pill'>"+rangeText(c.weeks)+"</span></div></div>";
  }).join("");
  el.querySelectorAll("[data-c]").forEach(function(elc){
    elc.onclick=function(){ openDetail(Number(elc.getAttribute("data-c"))); };
  });
}

/* ============ week grid ============ */
function renderGrid(){
  const cont=$("#grid"); const w=effWeek();
  $("#weekTitleNum").textContent=w;
  const todayCol=effDay();
  const nowP=periodOfNow(effNow());
  let html="<table class='grid'><thead><tr><th class='corner'></th>";
  for(let d=1;d<=7;d++){ html+="<th class='"+(d===todayCol?"is-today":"")+"'>"+(d===todayCol?"<div>今天</div>":"")+"<div>"+DAYS[d-1]+"</div></th>"; }
  html+="</tr></thead><tbody>";
  let prevSection="";
  GRID_ROWS.forEach(function(row, ri){
    const p1=row.group==="第1,2节"?1:row.group==="第3,4节"?3:row.group==="第5,6节"?5:row.group==="第7,8节"?7:row.group==="第9,10节"?9:11;
    const p2=p1+1;
    const tstart=PERIODS[p1-1].start, tend=PERIODS[p2-1].end;
    if(row.section!==prevSection){ prevSection=row.section; html+="<tr><td class='time' style='padding:2px 6px 0;font-size:11px;font-weight:800;color:var(--text-2)'>"+row.section+"</td><td colspan='7'></td></tr>"; }
    html+="<tr><td class='time'>"+tstart+"<br>"+tend+"</td>";
    for(let d=1;d<=7;d++){
      const cells=coursesForWeek(w).filter(function(c){ return c.day===d&&c.start===p1; });
      const isNow=(d===todayCol&&nowP>=p1&&nowP<=p2);
      html+="<td class='slot "+(isNow?"is-now":"")+"'>";
      cells.forEach(function(c){
        const col=colorFor(c.name);
        const nonFullWeek=c.weeks.length<save.totalWeeks;
        html+="<span class='gc "+(nonFullWeek?"ghost":"")+"' style='background:"+col+"' data-c='"+c.id+"'>"+c.name+(c.location?"<span class='loc'> ·"+c.location+"</span>":"")+"</span>";
      });
      html+="</td>";
    }
    html+="</tr>";
  });
  html+="</tbody></table>";
  cont.innerHTML=html;
  cont.querySelectorAll("[data-c]").forEach(function(elc){ elc.onclick=function(){ openDetail(Number(elc.getAttribute("data-c"))); }; });
}

/* ============ detail sheet ============ */
function openDetail(id){
  const c=courses.find(function(x){ return x.id===id; }); if(!c) return;
  state.selectedCourse=c;
  const w=effWeek();
  const col=colorFor(c.name);
  const mask=$("#detailMask");
  $("#detailSheet").innerHTML="<div class='grab'></div><h2 style='color:"+col+"'>"+c.name+"</h2><div class='sub' style='margin-bottom:4px'>"+timeRange(c)+" · "+DAYS[c.day-1]+"</div><div class='row'><div class='k'>上课周次</div><div>"+rangeText(c.weeks)+"</div></div><div class='row'><div class='k'>教师</div><div>"+teacherDetail(c)+"</div></div>"+(c.location?"<div class='row'><div class='k'>教室</div><div>"+c.location+"</div></div>":"")+"<div class='row'><div class='k'>时间</div><div>"+timeRange(c)+"</div></div><button class='close' id='detailClose'>关闭</button>";
  mask.classList.add("show");
  mask.querySelector("#detailClose").onclick=closeDetail;
}
function closeDetail(){ $("#detailMask").classList.remove("show"); }

/* ============ settings sheet ============ */
function renderSettings(){
  const s=$("#settingsSheet");
  s.innerHTML="<div class='grab'></div><h2 style='font-size:20px'>设置</h2><div style='height:12px'></div>"+
  "<div class='field'><label>开学日期（第 1 周的周一）</label><input type='date' id='setStart' value='"+save.semesterStart+"'></div>"+
  "<div class='field'><label>总教学周数</label><input type='number' id='setWeeks' min='1' max='30' value='"+save.totalWeeks+"'></div>"+
  "<div class='field'><label>学期名称</label><input type='text' id='setTerm' value='"+save.term+"'></div>"+
  "<div class='field'><label>主题</label><select id='setTheme'><option value='auto'"+(save.theme==="auto"?" selected":"")+">跟随系统</option><option value='light'"+(save.theme==="light"?" selected":"")+">浅色</option><option value='dark'"+(save.theme==="dark"?" selected":"")+">深色</option></select></div>"+
  "<div class='block-title' style='margin-top:16px'>调试 / 预览<span class='line'></span></div>"+
  "<div class='field'><label>模拟日期（留空=使用今天）</label><input type='date' id='setSimDate' value='"+save.simDate+"'></div>"+
  "<div class='field'><label>模拟时间（留空=使用当前时间）</label><input type='time' id='setSimTime' value='"+save.simTime+"'></div>"+
  "<div class='hint'>系统会根据「开学日期」自动算出今天是第几周、以及当前是否正在上课。用「模拟」可以预览任意一天/某一时刻的课表。预览后请清除模拟，恢复为自动。</div>"+
  "<div style='display:flex;gap:10px;margin-top:18px'><button class='close' style='margin-top:0;background:var(--surface-2);color:var(--text)' id='resetBtn'>重置</button><button class='close' style='margin-top:0' id='saveSettings'>保存</button></div>";
  $("#settingsMask").classList.add("show");
  $("#resetBtn").onclick=function(){ save=Object.assign({},DEFAULT_SETTINGS); persist(); renderAll(); closeSettings(); };
  $("#saveSettings").onclick=function(){
    save.semesterStart=$("#setStart").value||save.semesterStart;
    save.totalWeeks=Math.max(1,Number($("#setWeeks").value)||save.totalWeeks);
    save.term=$("#setTerm").value||save.term;
    save.theme=$("#setTheme").value;
    save.simDate=$("#setSimDate").value||"";
    save.simTime=$("#setSimTime").value||"";
    persist(); applyTheme(); renderAll(); closeSettings();
  };
}
function closeSettings(){ $("#settingsMask").classList.remove("show"); }

/* ============ view toggle ============ */
function renderAll(){
  applyTheme();
  renderBanner();
  $("#tabToday").classList.toggle("on", state.view==="today");
  $("#tabWeek").classList.toggle("on", state.view==="week");
  $("#todayView").style.display=state.view==="today"?"block":"none";
  $("#weekView").style.display=state.view==="week"?"block":"none";
  if(state.view==="today"){ renderNow(); renderDayTabs(); renderDayList(); }
  else { renderGrid(); }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme());
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", theme()==="dark"?"#101119":"#5668ff");
}

/* ============ boot ============ */
function bind(){
  $("#tabToday").onclick=function(){ state.view="today"; renderAll(); };
  $("#tabWeek").onclick=function(){ state.view="week"; renderAll(); };
  $("#settingsBtn").onclick=renderSettings;
  $("#detailMask").addEventListener("click", function(e){ if(e.target.id==="detailMask") closeDetail(); });
  $("#settingsMask").addEventListener("click", function(e){ if(e.target.id==="settingsMask") closeSettings(); });
  $("#weekStripMask").addEventListener("click", function(e){ if(e.target.id==="weekStripMask") closeStrip(); });
  $("#banner").style.cursor="pointer";
  $("#banner").onclick=renderWeekStrip;
  window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
}
bind();
renderAll();
/* keep banner clickable even when week=0 or >totalWeeks uses large number */
setInterval(function(){ /* light refresh of 'now' */ if(document.visibilityState==="visible"){ if(state.view==="today"){ renderNow(); } } }, 30000);
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

</script>
</body>
